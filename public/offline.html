<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Planner is offline</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; margin: 0;
           align-items: center; justify-content: center; text-align: center; padding: 24px;
           color: #111; background: #fff; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px;
             background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Trip Planner needs a connection the first time it opens. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
